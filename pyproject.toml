[project]
name = "fantasm"
dynamic = ["version"]
description = "Fantasm — the Fantastic (dis-/re-)Assembly tools for 6502 code"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Robert Smallshire" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Disassemblers",
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "asyoulikeit>=0.1",
    "networkx>=3.0",
]

[dependency-groups]
dev = [
    "bump-my-version>=0.28",
    "jinja2>=3.1",
    "pre-commit>=3.0",
    "pytest>=8.0",
]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=2",
    "sphinx-copybutton>=0.5",
    "sphinx-click>=6",
    "myst-parser>=3",
]

[project.urls]
Homepage = "https://github.com/acornaeology/fantasm"
Documentation = "https://acornaeology.github.io/fantasm/"
Repository = "https://github.com/acornaeology/fantasm"
Issues = "https://github.com/acornaeology/fantasm/issues"

[project.scripts]
fantasm = "fantasm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Pin the dependency index to canonical PyPI. Belt-and-braces with the
# .gitignored uv.lock: even if a private-index lockfile were
# accidentally re-introduced, or a contributor's global uv config
# pointed elsewhere, `uv sync` resolves from PyPI here. Slightly
# slower than an internal mirror locally; worth it for CI parity.
index-url = "https://pypi.org/simple"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
# Single source of truth for the package version is __version__ in the
# package __init__. bump-my-version (configured in [tool.bumpversion])
# updates that string and the duplicate in [tool.bumpversion]
# current_version in lock-step.
path = "src/fantasm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bumpversion]
current_version = "0.14.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
tag = true
commit = true
message = "Bump version: {current_version} → {new_version}"
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
files = [
    { filename = "src/fantasm/__init__.py" },
]

# After bump-my-version updates __init__.py but before it commits,
# regenerate the README (its template embeds {{ version }}) and stage
# it. Without this, every bump creates a commit + tag with a stale
# README, which the readme-check gate in release.yml refuses to
# publish.
pre_commit_hooks = [
    "uv run python scripts/generate_readme.py",
    "git add README.md",
]
