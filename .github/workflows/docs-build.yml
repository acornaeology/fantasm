name: Docs build

# Reusable workflow: builds the Sphinx site under docs/ with warnings
# treated as errors. Called by ci.yml on push/PR (validates the site
# builds cleanly) and by release.yml as both a publication gate and
# the upload step that feeds GitHub Pages.

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: >
          When true, also upload the built HTML as a Pages artifact
          (consumed by release.yml's deploy-docs job). ci.yml leaves
          this off — it only needs the strict-build gate, not the
          Pages upload.
        type: boolean
        default: false

jobs:
  build:
    name: Sphinx docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          cache-dependency-glob: pyproject.toml

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Build the Sphinx site with -W
        # `-W` turns warnings into errors so a documentation-time
        # regression (broken cross-reference, missing module, syntax
        # error in a code-block, …) fails CI rather than slipping into
        # a published build.
        run: uv run --group docs sphinx-build -b html -W docs docs/_build/html

      - name: Upload Pages artifact
        if: inputs.upload-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
