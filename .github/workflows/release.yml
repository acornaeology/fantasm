name: Release

# Atomic release workflow: on a `v*` tag produced by bump-my-version,
# runs the full test matrix, the README sync check, and the strict
# Sphinx build in parallel as three gates. Only when ALL gates are
# green do the publication jobs run — and they run in parallel so
# PyPI and GitHub Pages publish as one unit.
#
# A failing test matrix, a stale README, or a documentation build
# warning all hold back both publications, so every shipped version
# has green tests, a synced README, a warning-free docs build, a
# live PyPI package, and matching published docs.
#
# Pages uses the artifact produced by docs-build (uploaded via
# actions/upload-pages-artifact when called with
# `upload-artifact: true`) and deployed by actions/deploy-pages in
# deploy-docs. Keep both in this one workflow: the upload and deploy
# must share a workflow run.
#
# `workflow_dispatch` is enabled so a release can be re-attempted
# manually if one of the parallel publications fails transiently
# after the gates pass. Individual failed jobs can also be re-run
# from the Actions UI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Default read-only permissions for the workflow; each publishing job
# narrows its own permissions to what it actually needs.
permissions:
  contents: read

jobs:
  test:
    # Reuses the matrix defined in test.yml so CI and Release exercise
    # the exact same test surface against the built wheel.
    uses: ./.github/workflows/test.yml

  readme-check:
    # Same gate ci.yml runs on every push.
    uses: ./.github/workflows/readme-check.yml

  docs-build:
    # Same strict-build gate ci.yml runs on every push, with the Pages
    # artifact upload turned on so deploy-docs has something to ship.
    uses: ./.github/workflows/docs-build.yml
    with:
      upload-artifact: true

  publish-pypi:
    name: Publish to PyPI
    # All three gates must pass before publication. If any fails, this
    # job does not run.
    needs: [test, readme-check, docs-build]
    runs-on: ubuntu-latest
    # The `pypi` GitHub deployment environment is the gate for the
    # PYPI_TOKEN secret (and/or trusted-publishing OIDC config).
    environment:
      name: pypi
      url: https://pypi.org/project/fantasm/
    permissions:
      # Required if/when the project opts into PyPI trusted publishing
      # via OIDC. Harmless when using a token instead.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        # Uses UV_PUBLISH_TOKEN if set; otherwise uv falls back to
        # PyPI trusted publishing via the OIDC token minted by
        # GitHub (works when the project is registered as a trusted
        # publisher under the `pypi` environment).
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  deploy-docs:
    name: Deploy docs to GitHub Pages
    needs: [test, readme-check, docs-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Allow only one concurrent Pages deployment; don't cancel an
    # in-flight run because interrupting a deployment can leave Pages
    # in a stuck "pending" state.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
